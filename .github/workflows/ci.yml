name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: syntax + mock regression (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Syntax check
        run: |
          for f in server.mjs lib/*.mjs test/*.mjs; do
            echo "check $f"
            node --check "$f"
          done

      - name: Mock upstream regression (11 cases, no credentials needed)
        run: node --test test/pool.test.mjs
